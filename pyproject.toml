[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantree"
version = "0.1.2"
description = "Treesitter, but with more Pydantic."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" }
]
license = { file = "LICENSE" }
keywords = ["tree-sitter", "pydantic", "parser", "ast"]

# Phase 6 (the consumer seam): this root project is now the LEGACY
# distribution only (the deprecated first-principles wrapper — frozen,
# untouched) plus the dev flow. The real products ship separately under src/:
#
#   src/tscore/pyproject.toml      light — the shared seam
#   src/tsquery/pyproject.toml     light — Product A (no toolchain)
#   src/tsgrammar/pyproject.toml   heavy — Product B (Rust CLI + C toolchain)
#
# The distributions are pydantree-BRANDED (pydantree-tscore / -tsquery /
# -tsgrammar) while the import packages stay tscore/tsquery/tsgrammar — the
# bare `tsquery` name is taken on PyPI by an unrelated GPL package, and the
# project identity is pydantree.
#
# A consumer installs tscore + tsquery ONLY and gets the full checked
# extraction; tsgrammar (and the scanner package data) ships separately.
dependencies = [
  "pydantic>=2.11",
  "tree-sitter>=0.26",  # the 0.26 floor (was >=0.23 while the code used
                        # 0.26-only APIs)
  "tree-sitter-python>=0.23.6",
]

[project.optional-dependencies]
# Development tooling (tests, lint, type‑check, coverage). The dev editable
# install covers the whole suite:
#
#   uv pip install -e . -e src/tscore -e src/tsquery -e src/tsgrammar
#
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "coverage>=7.0",
  "tree-sitter-json>=0.24",  # Phase 1 (Product A) spike target grammar
]
# 👉 Language bundle for Python examples.
python = [
  "tree-sitter-python>=0.23",  # pre‑compiled wheel containing the Python grammar
]

# ─────────────────────────────────────────────
# Packaging layout & entry point configuration
# ─────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
# the legacy wrapper + examples + data ONLY — tsgrammar/tsquery/tscore are
# excluded from this wheel (they ship as their own distributions)
packages = ["src/pydantree", "src/examples", "data"]

[project.scripts]
pydantree = "pydantree.cli:main"
demo = "examples.demo:main"

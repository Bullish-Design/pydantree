[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantree"
version = "0.1.2"
description = "Treesitter, but with more Pydantic."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" }
]
license = { file = "LICENSE" }
keywords = ["tree-sitter", "pydantic", "parser", "ast"]

# The root project is the uv-workspace + dev-tooling envelope ONLY — no
# distribution of its own (the legacy `src/pydantree` island and the
# `data`/`examples` wheel contents were deleted in Phase 1 of the 014
# refactor). The real products ship under src/ as workspace members:
#
#   src/tscore/pyproject.toml      light — the shared seam
#   src/tsquery/pyproject.toml     light — Product A (no toolchain)
#   src/tsgrammar/pyproject.toml   heavy — Product B (Rust CLI + C toolchain)
#
# The distributions are pydantree-BRANDED (pydantree-tscore / -tsquery /
# -tsgrammar) while the import packages stay tscore/tsquery/tsgrammar — the
# bare `tsquery` name is taken on PyPI by an unrelated GPL package.
#
# A consumer installs tscore + tsquery ONLY and gets the full checked
# extraction; tsgrammar (and the scanner package data) ships separately.
#
# Phase 2 of the refactor renames these to pydantree-sitter /
# pydantree-sitter-grammar; until then the workspace members keep the old
# names.
dependencies = [
  "pydantic>=2.11",
  "tree-sitter>=0.26",  # the 0.26 floor (was >=0.23 while the code used
                        # 0.26-only APIs)
  "tree-sitter-python>=0.23.6",
]

[project.optional-dependencies]
# Development tooling (tests, lint, type‑check, coverage). With the uv
# workspace below, `devenv shell` runs `uv sync --all-extras` automatically
# (languages.python.uv.sync.enable in devenv.nix) — the root project + these
# extras land in the managed venv; the workspace src/ packages are resolved
# straight from `src/` via the venv's `_pydantree_src.pth` (no editable
# copies → no staleness). Run `uv lock` after changing dependencies.
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "coverage>=7.0",
  "tree-sitter-json>=0.24",  # Phase 1 (Product A) spike target grammar
]
# 👉 Language bundle for Python examples.
python = [
  "tree-sitter-python>=0.23",  # pre‑compiled wheel containing the Python grammar
]

[tool.uv.workspace]
# the three real products under src/ are uv workspace members — `uv sync`
# resolves them (and their pydantree-tscore/… inter-deps) in one lockfile.
# devenv installs them with --no-install-workspace (devenv's default): the
# dev venv resolves tscore/tsquery/tsgrammar straight from src/ via the
# venv's _pydantree_src.pth, so edits are always live (no stale copies).
members = ["src/tscore", "src/tsquery", "src/tsgrammar"]

[tool.uv.sources]
# cross-member dependencies (e.g. src/tsgrammar depends on
# pydantree-tscore>=0.1) resolve to the workspace members, not PyPI
pydantree-tscore = { workspace = true }
pydantree-tsquery = { workspace = true }
pydantree-tsgrammar = { workspace = true }

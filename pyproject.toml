[build-system]
requires = ["hatchling>=1.21.0", "hatch-vcs>=0.3.0"]
build-backend = "hatchling.build"

[project]
name = "pydantree"
dynamic = ["version"]
description = "Python + Pydantic models for Tree-sitter query workflows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Bullish Design", email = "bullishdesignengineeringllc@gmail.com" }]
keywords = ["tree-sitter", "pydantic", "query", "neovim", "codegen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

dependencies = [
  "pydantic>=2.11,<3.0",
  "tree-sitter>=0.23.0,<1.0",
  "typer>=0.16.0,<1.0",
  "rich>=13.0.0,<14.0",
]

[project.optional-dependencies]
python = ["tree-sitter-python>=0.23.6"]
javascript = ["tree-sitter-javascript>=0.23.0"]
typescript = ["tree-sitter-typescript>=0.23.0"]
json = ["tree-sitter-json>=0.23.0"]
common = ["pydantree[python,javascript,typescript,json]"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "mypy>=1.10.0",
  "ruff>=0.4.0",
  "black>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/pydantree/pydantree"
Repository = "https://github.com/pydantree/pydantree"

[project.scripts]
pydantree = "pydantree.cli:main"
pydantree-codegen = "pydantree.codegen.cli:main"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "src/pydantree/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantree"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true

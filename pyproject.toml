[tool.uv]
# REVIEW 018 P2: the root is a VIRTUAL workspace member (no distribution of
# its own) — `package = false` means uv never builds/installs a `pydantree`
# wheel; `pip install .` at the root cannot produce one either. The real
# products ship under src/ as workspace members.
package = false

[project]
# The envelope-only metadata (P1: version agrees with both dists, 0.1.0).
name = "pydantree"
version = "0.1.0"
description = "Treesitter, but with more Pydantic. (Workspace envelope — the products are pydantree-sitter and pydantree-sitter-grammar under src/.)"
requires-python = ">=3.11"

[project.optional-dependencies]
# Development tooling (tests, lint, type‑check, coverage). With the uv
# workspace below, `devenv shell` runs `uv sync --all-extras` automatically
# (languages.python.uv.sync.enable in devenv.nix) — the root's extras land in
# the managed venv; the workspace src/ packages are resolved straight from
# `src/` via the venv's `_pydantree_src.pth` (no editable copies → no
# staleness). Run `uv lock` after changing dependencies.
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "coverage>=7.0",
  "tree-sitter-json>=0.24",  # Phase 1 (Product A) spike target grammar
]
# 👉 Language bundle for Python examples.
python = [
  "tree-sitter-python>=0.23",  # pre‑compiled wheel containing the Python grammar
]

[tool.uv.workspace]
# The two products under src/ are uv workspace members — `uv sync` resolves
# them (and the heavy→light inter-dep) in one lockfile. devenv installs them
# with --no-install-workspace (devenv's default): the dev venv resolves
# pydantree_sitter / pydantree_sitter_grammar straight from `src/` via the
# venv's _pydantree_src.pth, so edits are always live (no stale copies).
members = ["src/pydantree_sitter", "src/pydantree_sitter_grammar"]

[tool.uv.sources]
# cross-member dependency (pydantree_sitter_grammar depends on
# pydantree-sitter>=0.1) resolves to the workspace member, not PyPI
pydantree-sitter = { workspace = true }
pydantree-sitter-grammar = { workspace = true }

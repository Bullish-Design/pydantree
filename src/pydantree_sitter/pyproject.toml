[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantree-sitter"
version = "0.4.0"
description = "Product A — model-only typed extraction over tree-sitter grammars. Light runtime: the C binding + pydantic; no Rust CLI, no compiler."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"               # PEP 639 (the LICENSE file rides in the wheel)
keywords = ["tree-sitter", "pydantic", "parser", "ast", "extraction"]
authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing",
]
dependencies = [
  "pydantic>=2.11",
  "tree-sitter>=0.26,<0.27",  # ABI data used by conformance verification
]

[project.optional-dependencies]
# Project 022 — structural pattern matching and rewrite (`pydantree_sitter.pattern`).
# Optional on purpose: the base runtime stays the C binding + pydantic. The
# module imports `ast_grep_py` inside `Pattern.__init__`, never at import
# time, so `from pydantree_sitter import Pattern` works without this extra.
pattern = ["ast-grep-py>=0.39"]

[project.urls]
Homepage = "https://github.com/Bullish-Design/pydantree"
Source = "https://github.com/Bullish-Design/pydantree"

[tool.hatch.build.targets.wheel.force-include]
# REVIEW 018 P4: explicit file list — the whole-dir mapping shipped
# pyproject.toml/README.md/PKG-INFO inside the import namespace (hatch does
# not filter force-included files by `exclude`). Sources are relative to the
# member root (this dir); targets are the wheel layout. Add a new package
# file HERE; tests/test_packaging.py asserts the wheel's .py set equals the
# source dir's, so a forgotten registration fails loudly.
"__init__.py" = "pydantree_sitter/__init__.py"
"py.typed" = "pydantree_sitter/py.typed"
"LICENSE" = "pydantree_sitter/LICENSE"
"codecs.py" = "pydantree_sitter/codecs.py"
"errors.py" = "pydantree_sitter/errors.py"
"find.py" = "pydantree_sitter/find.py"
"generate.py" = "pydantree_sitter/generate.py"
"grammar.py" = "pydantree_sitter/grammar.py"
"loader.py" = "pydantree_sitter/loader.py"
"match.py" = "pydantree_sitter/match.py"
"nodes.py" = "pydantree_sitter/nodes.py"
"raw.py" = "pydantree_sitter/raw.py"
"agreement.py" = "pydantree_sitter/agreement.py"
"pattern.py" = "pydantree_sitter/pattern.py"
"rules.py" = "pydantree_sitter/rules.py"
"schema.py" = "pydantree_sitter/schema.py"
"span.py" = "pydantree_sitter/span.py"
"syntax.py" = "pydantree_sitter/syntax.py"

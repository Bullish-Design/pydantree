[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantree-sitter-grammar"
version = "0.1.0"
description = "Product B — author tree-sitter grammars in Pydantic. Heavy build tool: pydantree-sitter + the tree-sitter CLI + a C toolchain; produces the artifacts A consumes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"               # PEP 639 (the LICENSE file rides in the wheel)
keywords = ["tree-sitter", "pydantic", "parser", "grammar", "GLR"]
authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing",
]
dependencies = [
  "pydantree-sitter>=0.1",
  "pydantic>=2.11",
  "tree-sitter>=0.26",  # the 0.26 floor
]

[project.urls]
Homepage = "https://github.com/Bullish-Design/pydantree"
Source = "https://github.com/Bullish-Design/pydantree"

[tool.hatch.build.targets.wheel.force-include]
# REVIEW 018 P4: explicit file list — the whole-dir mapping shipped
# pyproject.toml/README.md/PKG-INFO inside the import namespace (hatch does
# not filter force-included files by `exclude`). Sources are relative to the
# member root (this dir); targets are the wheel layout. The scanner .c files
# ride as package data in THIS (heavy) wheel only. Add a new package file
# HERE; tests/test_packaging.py asserts the wheel's .py set equals the
# source dir's, so a forgotten registration fails loudly.
"__init__.py" = "pydantree_sitter_grammar/__init__.py"
"py.typed" = "pydantree_sitter_grammar/py.typed"
"LICENSE" = "pydantree_sitter_grammar/LICENSE"
"builder.py" = "pydantree_sitter_grammar/builder.py"
"checks.py" = "pydantree_sitter_grammar/checks.py"
"conflicts.py" = "pydantree_sitter_grammar/conflicts.py"
"corpus.py" = "pydantree_sitter_grammar/corpus.py"
"expressions.py" = "pydantree_sitter_grammar/expressions.py"
"ir.py" = "pydantree_sitter_grammar/ir.py"
"language.py" = "pydantree_sitter_grammar/language.py"
"patterns.py" = "pydantree_sitter_grammar/patterns.py"
"pipeline.py" = "pydantree_sitter_grammar/pipeline.py"
"rules.py" = "pydantree_sitter_grammar/rules.py"
"schema_tool.py" = "pydantree_sitter_grammar/schema_tool.py"
"scanners" = "pydantree_sitter_grammar/scanners"

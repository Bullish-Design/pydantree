[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantree-tscore"
version = "0.1.0"
description = "The tiny shared seam between tsgrammar (B) and tsquery (A): the grammar node-schema + the artifact-loading contract (CONCEPT §8). Pure Python, no toolchain."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["tree-sitter", "pydantic", "grammar", "node-schema"]

# the A/B seam: tscore is the ONE package both halves import. The exact-path
# derivation (tscore._ir_derive) imports tsgrammar's IR, but ONLY when called
# (B-side) — so tscore declares NO tsgrammar dependency and `import tscore`
# stays B-free. tree-sitter>=0.26 is a floor: the code uses 0.26-only APIs
# (reparse, field_name_for_child, node.id, is_missing).
dependencies = [
  "pydantic>=2.11",
  "tree-sitter>=0.26",
]

[tool.hatch.build.targets.wheel.force-include]
# this pyproject lives INSIDE the package dir (the per-package pyproject shape,
# CONCEPT §8 — one installable per src/ package); map the dir's contents into
# the wheel as the `tscore` package. pyproject.toml / PKG-INFO ride along —
# a harmless hatchling artifact of this layout, kept for the flat src/ layout
# (the editable .pth and the phase experiments resolve packages straight from
# src/, so the package files must stay where they are).
"." = "tscore"
